# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Milk_Dragon's blog
subtitle: ''
description: ''
keywords:
author: zzy
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://ccbserver.qzz.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - google*.html
  - baidu*.html

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: prismjs
highlight:
  line_number: true
  auto_detect: false
  tab_replace: '    '
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: '    '
  theme: one-light
  theme_dark: one-dark

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: next

# 提交链接到搜索引擎
# 文档: https://cjh0613.com/20200603HexoSubmitUrlsToSearchEngine.html
hexo_submit_urls_to_search_engine:
  submit_condition: count  # count | period (目前只支持 count)
  count: 10                # 每次提交最新 10 条链接
  period: 900              # period 模式下的时间窗口（秒）
  google: 0                # 1=提交, 0=不提交
  bing: 1                  # 1=提交, 0=不提交
  baidu: 1                 # 1=提交, 0=不提交
  txt_path: submit_urls.txt  # 生成的链接文件路径（相对于 public/）
  baidu_host: https://ccbserver.qzz.io     # 百度站长平台已验证的域名
  baidu_token: 0           # 设为 0 则读取环境变量 BAIDU_TOKEN
  bing_host: https://ccbserver.qzz.io      # 必应站长平台已验证的域名
  bing_token: 0            # 设为 0 则读取环境变量 BING_TOKEN
  google_host: https://ccbserver.qzz.io    # Google Search Console 已验证的域名
  google_key_file: google-service-account.json  # 服务账号 JSON（根目录），不要提交到公开仓库
  google_proxy: 0          # 代理，格式如 http://127.0.0.1:7890
  replace: 0               # 是否替换链接前缀
  find_what: http://ccbserver.qzz.io
  replace_with: https://ccbserver.qzz.io

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  - type: git
    repo: git@github.com:IOIgf/zzyblog.git
    branch: gh-pages
    url: https://ccbserver.qzz.io/
  - type: cjh_baidu_url_submitter
  - type: cjh_bing_url_submitter
  - type: cjh_google_url_submitter

# 站点地图
sitemap:
  path: sitemap.xml
baidusitemap:
  path: baidusitemap.xml

# robots.txt
robotstxt:
  useragent: "*"
  allow:
    - /
  sitemap: https://ccbserver.qzz.io/sitemap.xml

search:
  path: search.xml
  field: post
  format: html
  limit: 10000
  
# Markdown-it 配置
markdown:
  render:
    html: true          # 允许 HTML 标签
    xhtmlOut: false     # 不使用 XHTML 输出
    breaks: false       # 换行符不转换为 <br>
    linkify: true       # 自动将 URL 转为链接
    typographer: true   # 启用智能引号等排版优化
    quotes: '“”‘’'      # 自定义引号样式
  highlight: auto
  plugins:
    # - markdown-it-mathjax3   # 启用 MathJax 插件
  anchors:
    level: 2           # 标题锚点层级
    collisionSuffix: '' # 重复标题的后缀
    permalink: false    # 是否显示永久链接
    permalinkClass: 'header-anchor'
    permalinkSymbol: ''
